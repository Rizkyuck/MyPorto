  <rect x="564" y="396" width="152" height="122" rx="8" fill="#18141f" stroke="#4ade80" stroke-opacity="0.35"/>
  <text x="580" y="420" fill="#9ca3af" font-family="monospace" font-size="10">LINK MARGIN</text>
  <text x="580" y="454" fill="#4ade80" font-family="monospace" font-weight="bold" font-size="24">+16.8 dB</text>
  <text x="580" y="482" fill="#4ade80" font-family="monospace" font-size="11">● LINK LOCKED</text>
  <text x="580" y="502" fill="#9ca3af" font-family="monospace" font-size="10">C/N0: 84.5 dB-Hz</text>

  <text x="84" y="518" fill="#d1d5db" font-family="monospace" font-size="11">Cloudflare DoH API • Multi-Region Edge Ping • Satellite Downlink FSPL Calculator</text>
