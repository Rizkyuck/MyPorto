      <stop offset="0%" stop-color="#1b1721"/>
      <stop offset="55%" stop-color="#2c2436"/>
      <stop offset="100%" stop-color="#3c2d40"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
